# Source-backed issuer evidence. These are data checks, not valuation forecasts.
# See examples/valuation.toml and docs/valuation-method.md.
# Personal entries belong in valuation.local.toml (git-ignored).
[issuers]

[issuers."ASML.AS"]
source = "ASML Q2 2026 US-GAAP statements pp6/8 and IFRS interim debt note: https://www.investor.asml.com/static-files/5dc79e92-9e59-4a06-af63-22eb4408af16 ; https://www.sec.gov/Archives/edgar/data/937966/000162828026048235/statutoryinterimreport20.htm"
as_of = "2026-07-15"
period_end = "2026-06-30" # Yahoo's label for the issuer's June 28 fiscal quarter.
currency = "EUR"
statement_rounding_unit = 100000 # EUR millions, one decimal, in the source statements.

[[issuers."ASML.AS".filing_checks]]
statement = "balance"
field = "debt"
period_type = "instant"
period_end = "2026-06-30"
reported_period_end = "2026-06-28"
source_basis = "IFRS"
provider_basis = "US GAAP"
value = 3719700000 # IFRS current1,735.3m + noncurrent1,984.4m; reference, not a US-GAAP replacement.
rounding_unit = 200000 # Sum of two figures rounded to EUR0.1m: total error <=EUR0.1m.
source = "IFRS-sourced reconciliation reference; June US-GAAP current debt unresolved. Independent US-GAAP annual note corroborates the principal instruments, not exact June carrying amounts: https://www.sec.gov/Archives/edgar/data/937966/000162828026048235/statutoryinterimreport20.htm ; https://www.sec.gov/Archives/edgar/data/937966/000162828026011378/R103.htm"

