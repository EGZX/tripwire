# Fictional examples only. This file is NOT loaded by the screener.
# Copy a complete issuer entry to overrides/valuation.local.toml only after
# replacing the identifier, sources, dates, currency and all financial inputs.
# Amounts below are raw currency units, percentages annual decimal fractions.
# Quote dotted ticker keys, e.g. [issuers."EXAMPLE.SW"].
# A sourced model_family can correct provider classification (see method docs).

[issuers.EXAMPLE_BANK]
source = "Replace with filing/table and assumption rationale"
as_of = "2026-06-30"
period_end = "2026-06-30"
currency = "USD"
model = "bank_capital"
country_risk_premium = 0.02
discount_rate = 0.11
discount_rate_basis = "cost_of_equity"

[issuers.EXAMPLE_BANK.base]
net_income = 10.0
growth = 0.05
capital_growth = 0.04
available_capital = 100.0
capital_base = 1000.0
required_capital_ratio = 0.10
payout_limit = 1.0
