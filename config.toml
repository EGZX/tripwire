# Screener configuration. Paths are relative to the repository root.

[inputs]
koyfin_glob = "input/koyfin/*.csv"            # drop any number of Koyfin watchlist exports here
parqet_holdings = "input/parqet_holdings.csv" # isin,name,shares,value_eur  (current holdings)
extra_tickers = "input/extra_tickers.csv"     # optional: yahoo_symbol,name
symbol_overrides = "overrides/symbols.csv"
classification_overrides = "overrides/classification.csv"

[fetch]
pause_seconds = 0.4            # politeness delay between symbols
fundamentals_max_age_days = 6  # cached statements younger than this are reused
max_retries = 4                # backoff 30s, 60s, 120s, 240s on rate limits

[valuation]
equity_risk_premium = 0.045    # hurdle = currency risk-free + this. 1.0 x ERP: a market-like required return
adverse_return_spread = 0.025  # adverse-case floor = currency risk-free + this (half the ERP: a real return even in the bad case)
min_hurdle = 0.07              # never require less than this nominal return, whatever the local rates say
min_rate_over_terminal_growth = 0.02  # hurdle and floor are lifted to at least terminal growth + this (Gordon needs r > g)
base_currency = "EUR"          # implied returns are also shown converted to this currency by the rate differential
adverse_growth_mode = "half"   # "half": adverse growth = half the lowest growth input (declines kept); "haircut": minus adverse_growth_haircut
adverse_growth_haircut = 0.05
cyclical_adverse_growth_at_terminal = true  # cyclicals: adverse growth never above terminal growth (cycle reverts to trend)
cyclical_adverse_margin = "min"             # cyclicals: adverse case uses the trough EBIT margin ("median" to disable)
years = 10                     # growth and the return on new capital fade linearly over this horizon
growth_cap = 0.30              # cap on the reasonable-case starting growth (also capped at the return on capital)
growth_floor = -0.05
return_cap = 0.40              # cap on the return on new capital (book capital is unreliable above this)
return_smoothing = true        # return on new capital = lower of current and 3-year average
insurer_smooth_earnings = true # insurers: base earnings = lower of TTM and 3-year average
bank_min_equity_to_assets = 0.04  # banks below this get a critical "thin capital" flag
stale_after_days = 270         # flag when the oldest statement used is older than this

# Per reporting currency: 10-year government yield (rf), nominal terminal growth (g) and country risk premium (crp,
# added to both the hurdle and the floor; 0 for the majors). Hurdle = rf + equity_risk_premium + crp; adverse floor =
# rf + adverse_return_spread + crp. The run refuses to start if a reporting currency in the universe is missing here.
# Values are Oct 2026 estimates: update when rates move.
[rates]
USD = { rf = 0.0524, g = 0.030, as_of = "2026-10-10" }
