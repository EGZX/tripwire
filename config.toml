# Screener configuration. Paths are relative to the repository root.

[inputs]
watchlist = "input/watchlist.csv"   # symbol,name,isin,yahoo_symbol,lists   (see examples/)
holdings = "input/holdings.csv"     # isin,symbol,name,shares,value_eur,cost_eur   (optional)
symbol_overrides = "overrides/symbols.csv"
classification_overrides = "overrides/classification.csv"
valuation_overrides = "overrides/valuation.toml" # source-labeled sector facts and base/stress assumptions

[fetch]
pause_seconds = 0.4            # politeness delay between symbols
fundamentals_max_age_days = 6  # cached statements younger than this are reused
max_retries = 4                # backoff 30s, 60s, 120s, 240s on rate limits

[valuation]
equity_risk_premium = 0.045    # hurdle = currency risk-free + this. 1.0 x ERP: a market-like required return

min_hurdle = 0.07              # never require less than this nominal return, whatever the local rates say
min_rate_over_terminal_growth = 0.02  # hurdle and floor are lifted to at least terminal growth + this (Gordon needs r > g)
base_currency = "EUR"          # reference currency for explicit constant-FX policy scenarios when no local rate is configured
years = 10                     # explicit forecast horizon; model-specific growth/earning-power paths converge to stated terminal assumptions
stale_after_days = 270         # flag when the oldest statement used is older than this
quote_max_age_days = 7         # calendar-day freshness policy; accommodates normal market closures
rates_max_age_days = 90        # same review interval as the dashboard rate warning

# Currency rates set nominal policy hurdles and terminal growth. Country risk is
# configured separately below; reporting currency never determines geographic risk.
# Base and operating stress use the SAME discount rate.
# Values are Oct 2026 estimates: update when rates move.
[rates]
USD = { rf = 0.0524, g = 0.030, as_of = "2026-10-10" }
EUR = { rf = 0.027, g = 0.020, as_of = "2026-10-10" }
